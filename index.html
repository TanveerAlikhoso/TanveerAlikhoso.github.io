<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tanveer Ali — Pixametry Lab | Chat Portfolio</title>
<meta name="description" content="Don't scroll a long page. Just ask. Tanveer Ali builds Pixametry Lab: grounded mini-SaaS AI tools for small businesses.">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f4f5f6;color:#111}
.wrap{max-width:720px;margin:0 auto;padding:28px 16px 48px}
.hero{text-align:center;padding:18px 8px 8px}
.monogram{width:56px;height:56px;margin:0 auto 14px;background:#111;color:#fff;border-radius:14px;display:grid;place-items:center;font-weight:800;letter-spacing:1px}
.hero h1{font-size:clamp(34px,7vw,56px);line-height:1.02;margin:8px 0}
.hero h1 span{color:#2563eb}
.hero p{color:#555;font-size:17px;line-height:1.6;max-width:560px;margin:12px auto}
.pill{display:inline-block;background:#111;color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;margin:3px}
.pill.light{background:#e7e7e7;color:#111}
.chat{background:#fff;border:1px solid #e2e2e2;border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.06);padding:18px;margin-top:18px}
.thread{display:flex;flex-direction:column;gap:14px;min-height:220px}
.user{align-self:flex-end;background:#2563eb;color:#fff;padding:10px 16px;border-radius:999px;max-width:88%;font-weight:600}
.bot{align-self:stretch;background:#f7f7f7;border:1px solid #e8e8e8;border-radius:18px;padding:16px 18px;line-height:1.6}
.bot h2,.bot h3{margin:6px 0 8px}.bot p{margin:8px 0}.bot a{color:#2563eb;font-weight:700;text-decoration:none}
.typing{color:#666;font-style:italic}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 10px}
.chips button{background:#fff;border:1px solid #ddd;border-radius:12px;padding:10px 12px;cursor:pointer;font-size:15px}
.chips button:hover{border-color:#111}
.inputrow{display:flex;gap:8px;margin-top:12px}
.inputrow input{flex:1;border:1px solid #ddd;border-radius:999px;padding:13px 18px;font-size:16px;outline:none}
.inputrow input:focus{border-color:#2563eb}
.inputrow button{width:48px;height:48px;border:0;border-radius:50%;background:#2563eb;color:#fff;font-size:20px;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.card{border:1px solid #e5e5e5;border-radius:14px;padding:12px;background:#fff}
.card b{display:block}.card small{color:#555}
.tag{display:inline-block;background:#111;color:#fff;border-radius:999px;padding:5px 10px;font-size:13px;margin:3px}
.price{font-size:28px;font-weight:800}.best{color:#2563eb}
.links a{display:block;background:#f1f1f1;border-radius:12px;padding:12px 14px;margin:8px 0;color:#111;text-decoration:none;font-weight:700}
.links a:after{content:" →";float:right;color:#2563eb}
.footer{text-align:center;color:#666;font-size:14px;margin-top:22px}
button.home{background:none;border:0;color:#2563eb;cursor:pointer;font-weight:700;padding:0}
@media(max-width:560px){.grid{grid-template-columns:1fr}.chat{padding:14px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="monogram">PL</div>
    <div>Hey, I'm Tanveer 👋</div>
    <h1>Pixametry <span>Lab</span></h1>
    <p>Mini-SaaS for small business. Grounded AI. Embedded in minutes.<br>APIs · Chat · Leads · Search — Karachi, Pakistan</p>
    <span class="pill">● LIVE — 12 TOOLS</span>
    <span class="pill light">React · Next.js · Tailwind</span>
  </div>

  <div class="chat" role="main">
    <div class="thread" id="thread"></div>
    <div class="chips" aria-label="Quick questions">
      <button data-q="me">🙋 Me</button>
      <button data-q="tools">🚀 Tools</button>
      <button data-q="skills">🛠️ Skills</button>
      <button data-q="pricing">💰 Pricing</button>
      <button data-q="contact">✉️ Contact</button>
    </div>
    <form class="inputrow" id="form">
      <input id="input" type="text" placeholder="Ask me anything…" aria-label="Ask me anything" autocomplete="off">
      <button type="submit" aria-label="Send">↑</button>
    </form>
    <div style="text-align:center;margin-top:10px"><button class="home" id="home">← Back to home</button></div>
  </div>

  <div class="footer">Portfolio of Tanveer Ali · Karachi, Pakistan<br><a href="https://pixametry-lab.vercel.app">pixametry-lab.vercel.app</a></div>
</div>

<script>
const tools=[
["01","AI Chat Widget","Answers visitors from your own content, with citations"],
["02","AI Lead Form","Turns a “don't know” into a rescued lead"],
["03","AI Smart Search","Search that answers, not just links"],
["04","FAQ / AEO Widget","Grounded answers + Gap Radar for unanswered questions"],
["05","AI Review Wall","Real reviews, published even at 1 star, with owner replies"],
["06","AI Quote Calculator","Instant quotes from your own pricing rules"],
["07","AI Product Finder Quiz","“Which one is right for me?” in 3 questions"],
["08","AI Voice Receptionist","Demo — knows when to take a callback, not guess"],
["09","AI SEO Health Check","A real health check — demo in sample mode"],
["10","AI Backlink Tracker","Verified links only — demo in sample mode"],
["11","Service Area Checker","Covered / edge / not-covered, owner areas only"],
["12","Open-Now Checker","“Are you open now?” from owner hours + closures"]
];
const toolsHTML='<h2>🚀 My Tools</h2><p>12 tools, all live on the site. Not ideas — things you can try right now.</p><div class="grid">'+tools.map(t=>'<div class="card"><small>'+t[0]+'</small><b>'+t[1]+'</b><small>'+t[2]+'</small></div>').join('')+'</div><p><a href="https://pixametry-lab.vercel.app/demo">🧪 Try the live demos →</a> &nbsp; <a href="https://pixametry-lab.vercel.app/products">🛒 See all 12 tools →</a></p>';
const answers={
me:'<h2>🙋 Me</h2><p>I’m <b>Tanveer Ali</b>, a frontend developer focused on SaaS products — clean, scalable interfaces in React, Next.js, and Tailwind, API-driven.</p><p>I build <b>Pixametry Lab</b>: small AI web components for small businesses. My rule is simple: <b>grounded, or it says it doesn’t know.</b> Unanswered questions go to a Gap Radar, and a “don’t know” becomes a rescued lead — not a lost visitor.</p><p><b>How I work:</b> Embed → Feed your own content → Go live. Audit before ship, mobile / tablet / iOS first, sample data always badged.</p>',
tools:toolsHTML,
skills:'<h2>🛠️ Skills</h2><p>The stack I actually ship with:</p><p><span class="tag">React</span><span class="tag">Next.js</span><span class="tag">Tailwind</span><span class="tag">Vercel</span><span class="tag">Supabase</span><span class="tag">OpenAI (BYOK)</span></p><p>Plus: embeddable widgets, grounded AI answers, lead capture, and mobile-first builds.</p>',
pricing:'<h2>💰 Pricing</h2><p>No custom-quote fog. The site’s locked pricing:</p><p><span class="price">$59</span> one-time pack<br><br>Hosted: <b>$19 / <span class="best">$49 Best Value</span> / $149</b> per month</p><p>No fake tiers. No invented limits. Prices as shown on the live site.</p>',
contact:'<h2>✉️ Let’s Work Together</h2><p>The fastest way to reach me is through the lab itself:</p><div class="links"><a href="https://pixametry-lab.vercel.app">🌐 Live lab — pixametry-lab.vercel.app</a><a href="https://pixametry-lab.vercel.app/demo">🧪 Live demos</a><a href="https://pixametry-lab.vercel.app/products">🛒 All 12 tools</a></div><p>💬 Say hello through the Lead Rescue form on the site — it actually reaches me. I don’t publish a mailbox that doesn’t exist.</p>'
};
const prompts={me:'Tell me about yourself',tools:'Show me your tools',skills:'What are your skills?',pricing:'What does it cost?',contact:'How can I contact you?'};
const thread=document.getElementById('thread');
function addUser(t){const d=document.createElement('div');d.className='user';d.textContent=t;thread.appendChild(d);thread.scrollIntoView({block:'end'});}
function addBot(html){const d=document.createElement('div');d.className='bot';d.innerHTML=html;thread.appendChild(d);d.scrollIntoView({block:'end'});}
function typingThen(html){const d=document.createElement('div');d.className='typing';d.textContent='Pixametry is typing…';thread.appendChild(d);setTimeout(()=>{d.remove();addBot(html);},550);}
function welcome(){thread.innerHTML='';addBot('<h2>Welcome to my AI-style portfolio 👋</h2><p><b>How it works:</b> Instead of scrolling a long page, just ask. Tap <b>Me, Tools, Skills, Pricing or Contact</b> — or type your own question — and I’ll answer with my real tools and prices.</p><p>Try this: <b>“Show me your tools”</b> — or ask about a tool, like “What is the Lead Form?”</p>');}
function answerFor(q){
 q=q.toLowerCase();
 if(q.includes('tool')||q.includes('project')||q.includes('product')||q.includes('chat widget')||q.includes('lead')||q.includes('search')||q.includes('faq')||q.includes('review')||q.includes('quote')||q.includes('quiz')||q.includes('voice')||q.includes('seo')||q.includes('backlink')||q.includes('service area')||q.includes('open')) return toolsHTML;
 if(q.includes('price')||q.includes('cost')||q.includes('plan')||q.includes('$')) return answers.pricing;
 if(q.includes('skill')||q.includes('stack')||q.includes('react')||q.includes('next')||q.includes('tailwind')) return answers.skills;
 if(q.includes('contact')||q.includes('hire')||q.includes('email')||q.includes('hello')||q.includes('reach')) return answers.contact;
 if(q.includes('yourself')||q.includes('about')||q.includes('who are')||q.includes('tanveer')) return answers.me;
 if(q.includes('demo')||q.includes('try')||q.includes('live')) return '<h2>🧪 Try it live</h2><p>Don’t take my word for it — try it:</p><p><a href="https://pixametry-lab.vercel.app/demo">Live demos →</a><br><a href="https://pixametry-lab.vercel.app/products">All 12 tools →</a><br><a href="https://pixametry-lab.vercel.app">Live lab →</a></p>';
 if(q.includes('grounded')||q.includes('gap')||q.includes('don\'t know')||q.includes('know')) return '<h2>🤖 Grounded, or I say so</h2><p>If Pixametry doesn’t know an answer, it doesn’t guess. It says so, saves the question to <b>Gap Radar</b>, and takes the visitor’s details for a callback. That’s the whole niche.</p>';
 return '<h2>🤔 I don’t know that yet</h2><p>I only answer from my real tools, skills, and pricing — I won’t guess about anything else.</p><p>Try: <b>Me, Tools, Skills, Pricing,</b> or <b>Contact</b> — or <a href="https://pixametry-lab.vercel.app">ask on the live lab →</a></p>';
}
function ask(key,text){addUser(text||prompts[key]||key);typingThen(key&&answers[key]?answers[key]:answerFor(text||key));}
document.querySelectorAll('.chips button').forEach(b=>b.addEventListener('click',()=>ask(b.dataset.q)));
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();const v=document.getElementById('input').value.trim();if(!v)return;document.getElementById('input').value='';ask(null,v);});
document.getElementById('home').addEventListener('click',welcome);
welcome();
</script>
</body>
</html>
